api_access:
  included_with_subscription: true
  metered_separately: false
  note: >-
    API access is a capability of an Eloqua subscription rather than a separately priced product.
    There is no developer self-serve signup: https://login.eloqua.com/ authenticates against an
    existing customer instance, and OAuth client credentials are minted inside that instance via
    Settings > AppCloud Developer > Create New App. A developer without an Eloqua tenancy cannot
    obtain credentials.
  evidence: >-
    https://docs.oracle.com/en/cloud/saas/marketing/eloqua-rest-api/Authentication_Auth.html
    ("In your Eloqua instance navigate to Settings > AppCloud Developer then select Create New App").
