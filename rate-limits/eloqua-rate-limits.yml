description: >-
  Published rate-limit posture for the Oracle Eloqua REST APIs. CORRECTION 2026-08-13 — this file
  previously carried a scaffold that asserted X-RateLimit-Limit / X-RateLimit-Remaining /
  X-RateLimit-Reset / RateLimit-Policy response headers. Oracle documents NONE of those headers.
  They have been removed. What Oracle actually publishes is a 429 status code, a throttling
  warning on one specific endpoint, and hard page-size caps — nothing more.
limit_count: 0
numeric_limits_published: false
headers:
  limit: null
  remaining: null
  reset: null
  retryAfter: null
  policy: null
  note: >-
    No rate-limit response header of any kind is documented on any Eloqua API family. An agent
    cannot read remaining budget from a response; it can only react to a 429 after the fact.
responseCodes:
  throttled: 429
  throttledMessage: Too Many Requests
  quotaExceeded: 413
  quotaExceededMessage: Storage space exceeded.
  serviceUnavailable: 503
limits:
  - scope: endpoint
    endpoint: https://login.eloqua.com/id
    window: null
    limit: null
    documented: true
    evidence: >-
      "There will be throttling or rate-limiting imposed on the /id endpoint to prevent this
      behavior. Instead, call it once per session (or after a reasonable period of time) and
      cache the results." — DeterminingBaseURL.html. No number is published.
  - scope: request
    api: Application API (REST 1.0 / 2.0)
    parameter: count
    limit: 1000
    unit: entities per page
    documented: true
    evidence: >-
      "Any whole number between 1 and 1000 inclusive." — APIRequests_URLParameters.html.
      This is a hard page-size cap, not a request-rate limit.
  - scope: account
    api: Bulk API 2.0
    window: null
    limit: null
    documented: false
    evidence: >-
      Oracle's Bulk API getting-started topic refers readers to "The Bulk API Limits
      documentation" for sizing guidance, but that topic lives in the Oracle Eloqua Developer's
      Guide (docs.oracle.com/en/cloud/saas/marketing/eloqua-develop/), a MadCap Flare help
      system whose topic paths are not enumerable — its TOC, sitemap and search index all
      resolve to the Oracle Help Center's generic 200 shell. The numbers could not be read.
  - scope: account
    api: Bulk API 2.0
    limit_type: staging storage
    documented: true
    evidence: >-
      Storage limits are enforced and surfaced as HTTP 413 "Storage space exceeded." and as
      ELQ-00136 "Staging area storage limit exceeded." in sync logs. No quota figure published.
exhaustion_behavior:
  status: 429
  retry_after_header: false
  documented_recovery: >-
    Oracle publishes retry guidance for 503 (check Eloqua System Status, retry with increasing
    delay) but no backoff guidance for 429. Bulk sync failures carry their own codes —
    ELQ-00145 states the request will be retried automatically, and ELQ-00146 instructs a retry
    after one hour.
  idempotency_warning: >-
    Eloqua documents no idempotency key, so a retry after a 429 or 503 on a write is not safe
    against duplication. See conventions/eloqua-conventions.yml.
agent_readiness_note: >-
  Rate-limit signaling is the weakest part of Eloqua's runtime contract. A 429 is documented, so
  an agent knows the failure mode, but with no headers and no published numbers it has no way to
  pace itself before hitting the wall or to know how long to wait after it does.
