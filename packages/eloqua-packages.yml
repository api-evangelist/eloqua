method: searched
source: >-
  Registry queries against registry.npmjs.org, pypi.org/pypi, rubygems.org/api/v1,
  the npm search API, and the GitHub repository search API; plus the Oracle Eloqua
  REST API reference at https://docs.oracle.com/en/cloud/saas/marketing/eloqua-rest-api/
provider: Oracle Eloqua
providerId: eloqua
description: >-
  Client library inventory for the Oracle Eloqua Application, Bulk and Reporting REST APIs.
  Oracle publishes no first-party Eloqua client library on any public package registry — every
  package below is community-maintained. This is a load-bearing finding: the Eloqua REST contract
  itself is current (Oracle's published Swagger carries info.version 2026.08.07), while the most
  widely installed community client last shipped in 2024 and the rest are 6-13 years stale.
summary:
  official_count: 0
  community_count: 6
  registries_checked:
    - npm
    - pypi
    - rubygems
    - github
  finding: >-
    No Oracle-published Eloqua SDK exists on npm, PyPI, RubyGems, Maven Central, NuGet,
    pkg.go.dev, Packagist or crates.io. The docs link that previously implied one
    (https://docs.oracle.com/en/cloud/saas/marketing/eloqua-rest-api/SDKs.html) is a soft 404 —
    Oracle Help Center answers HTTP 200 with the generic "Oracle Marketing - Get Started"
    shell for any unknown path under that book, so a 200 there is not a document.
