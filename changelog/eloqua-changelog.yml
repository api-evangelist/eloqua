description: >-
  Change-tracking posture for the Oracle Eloqua REST APIs. Oracle publishes no dated, per-release
  API changelog on the developer surface that a machine can read. What it does publish is a
  calendar-dated contract: the Swagger document carries info.version as a build date, so the
  contract itself is the change signal. That is a weaker artifact than a changelog — it tells you
  the document moved, not what moved inside it — but it is real and it is dated.
