  - id: json-schema
    name: JSON Schema component definitions
    conforms: true
    evidence: >-
      365 reusable definitions in the published Swagger, referenced via $ref across
      responses and request bodies.
  - id: tls
    name: TLS transport security
    conforms: true
    evidence: >-
      TLSv1.3 observed on secure.p01.eloqua.com and docs.oracle.com; Oracle documents
      SSL/TLS with 128-bit and 256-bit cipher support for all API calls. See
      security/eloqua-domain-security.yml.
