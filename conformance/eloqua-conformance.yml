standards:
  - id: oauth2
    name: OAuth 2.0 (RFC 6749)
    conforms: true
    evidence: >-
      Oracle documents the authorization endpoint https://login.eloqua.com/auth/oauth2/authorize
      and token endpoint https://login.eloqua.com/auth/oauth2/token, and supports the
      authorization_code, implicit and resource-owner-password-credentials grants with
      refresh tokens. Documented at
      https://docs.oracle.com/en/cloud/saas/marketing/eloqua-rest-api/Authentication_Auth.html
  - id: oauth2-discovery
    name: OAuth 2.0 Authorization Server Metadata (RFC 8414)
    conforms: false
    evidence: >-
      login.eloqua.com/.well-known/oauth-authorization-server returns 404;
      secure.p01.eloqua.com returns 200 with an HTML SPA shell, not metadata.
      See well-known/eloqua-well-known.yml.
  - id: oidc
    name: OpenID Connect
    conforms: false
    evidence: >-
      No /.well-known/openid-configuration document on any Eloqua host, and no id_token
      documented in the OAuth flows. Eloqua's OAuth is authorization only.
  - id: http-basic
    name: HTTP Basic Authentication (RFC 7617)
    conforms: true
    evidence: >-
      Documented as a supported (though not recommended) scheme using CompanyName\Username
      credentials — https://docs.oracle.com/en/cloud/saas/marketing/eloqua-rest-api/Authentication_Basic.html
  - id: odata
    name: OData query conventions
    conforms: partial
    evidence: >-
      123 operations in the published Swagger — the Reporting API 1.0 family — declare the
      OData query parameter set $select, $filter, $orderby, $top, $skip, $count and $expand.
      The Application and Bulk APIs use entirely different, non-OData conventions
      (page/count and limit/offset respectively), so Eloqua is not OData-conformant
      provider-wide.
  - id: rfc9457
    name: Problem Details for HTTP APIs (RFC 9457 / RFC 7807)
    conforms: false
    evidence: >-
      No operation declares application/problem+json. Errors use a proprietary
      {type, parameter, requirement, value} envelope plus an ELQ-nnnnn status code set.
      See errors/eloqua-problem-types.yml.
  - id: pagination
    name: Documented pagination
    conforms: true
    evidence: >-
      All three API families document pagination, but with three different conventions:
      page/count (Application, count capped at 1000), limit/offset with hasMore (Bulk),
      and $top/$skip (Reporting). Documented at
      https://docs.oracle.com/en/cloud/saas/marketing/eloqua-rest-api/APIRequests_URLParameters.html
  - id: idempotency
    name: Idempotency keys for unsafe methods
    conforms: false
    evidence: >-
      No idempotency header, request key or replay semantics documented for any API family.
  - id: rate-limit-headers
    name: RateLimit header fields for HTTP (IETF draft)
    conforms: false
    evidence: >-
      429 Too Many Requests is documented, but no RateLimit-*, X-RateLimit-* or Retry-After
      header is documented on any response.
  - id: rfc8594
    name: Sunset HTTP Header Field (RFC 8594)
    conforms: false
    evidence: No Sunset or Deprecation header documented; no dated deprecation policy published.
  - id: openapi
    name: OpenAPI / Swagger machine-readable contract
    conforms: true
    evidence: >-
      Oracle publishes a Swagger 2.0 document at
      https://docs.oracle.com/en/cloud/saas/marketing/eloqua-rest-api/swagger.json covering 459
      paths, 649 operations and 365 definitions across the Application, Bulk and Reporting APIs.
      It is linked from the reference's own index.html. Caveats: it is Swagger 2.0 rather than
      OpenAPI 3.x, it declares no securityDefinitions despite the API requiring auth, it names
      no host/basePath (correct, since Eloqua has no fixed host), it carries zero response
      examples, and operationIds are not unique — "SearchGETRest20" and
