bulk_flow:
  description: >-
    The Bulk API relationship that matters operationally is definition -> sync -> data.
    An export or import DEFINITION is created once and reused; a SYNC is created against a
    definition's uri and is the object you poll; the synced data is retrieved from or posted to
    the definition's staging area.
  edges:
    - from: Export
      to: Sync
      via: syncedInstanceUri
      cardinality: has_many
    - from: Import
      to: Sync
      via: syncedInstanceUri
      cardinality: has_many
    - from: Sync
      to: SyncLog
      via: /api/bulk/2.0/syncs/{id}/logs
      cardinality: has_many
    - from: Sync
      to: SyncReject
      via: /api/bulk/2.0/syncs/{id}/rejects
      cardinality: has_many
custom_fields:
  mechanism: fieldValues
  description: >-
    Contact and Account extend through a fieldValues[] array of FieldValue objects keyed by a
    numeric field id, not by name. A client must first resolve field ids from
    /api/bulk/2.0/contacts/fields or /API/REST/2.0/assets/contact/fields before it can read or
    write custom data. In the Bulk API the same fields are addressed by statement — for example
    Contact.Field(C_EmailAddress) — in the export/import definition's field map.
