description: >-
  Entity-relationship graph for the Oracle Eloqua REST APIs, derived from the $ref links and
  id-reference fields in Oracle's own published Swagger (365 definitions). Eloqua's model splits
  cleanly in two: ASSETS (emails, landing pages, forms, campaigns, programs, segments) which are
  authored marketing objects, and DATA (contacts, accounts, custom object data, activities) which
  are the records those assets act on. The Bulk API adds a third, operational layer — export and
  import definitions plus the syncs that move data through a staging area.
