identifiers:
  style: numeric string
  note: >-
    Eloqua ids are integers serialized as JSON strings ("id":"1"). There are no typed id
    prefixes. Every entity also carries a "type" discriminator naming its class
    (e.g. "type":"Contact"), which is how a response is identified rather than by id shape.
