implementation_notes:
  - >-
    Any Eloqua MCP server must resolve the caller's pod first. There is no single API host:
    a client authenticates, calls GET https://login.eloqua.com/id, and reads
    urls.apis.rest.standard / urls.apis.rest.bulk from the response. Hardcoding
    secure.p01.eloqua.com will break for instances on p02/p03/p04/p06/p07/p08.
  - >-
    Eloqua documents no idempotency key. Any write tool must be marked non-retry-safe or the
    server must implement its own dedupe.
