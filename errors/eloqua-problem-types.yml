description: >-
  Error catalog for the Oracle Eloqua Application, Bulk and Reporting REST APIs. Eloqua does NOT
  use RFC 9457 application/problem+json. It layers three distinct error vocabularies: standard
  HTTP status codes, a typed JSON validation-error envelope returned on 400, and an ELQ-nnnnn
  application status code set surfaced primarily through Bulk sync logs and rejects.
summary:
  http_status_codes: 10
  validation_error_types: 20
  eloqua_status_codes: 84
  operations_with_error_responses: 526

envelope:
  description: >-
    A failed validation returns a 400 with a typed JSON body naming the offending parameter and
    the requirement it violated.
  fields:
    type: Error type, e.g. EndpointParameterError or ObjectValidationError
    parameter: Name of the offending request parameter
    requirement: Nested object naming the violated requirement
    value: The rejected value
  example: |
    {
      "type":"EndpointParameterError",
      "parameter":"id",
      "requirement":{
        "type":"IdRequirement",
        "isRelativeAllowed":false
      },
      "value":"sandwich"
    }

http_status_codes:
  - status: 400
    title: "Bad Request"
    remediation: "Parsing error, missing reference, serialization error, or a validation error. See validation_error_types."
    spec_occurrences: 526
  - status: 401
    title: "Login required / Unauthorized"
    remediation: "Credentials or access token missing, expired or invalid. Oracle instructs clients to re-call https://login.eloqua.com/id on a 401 to distinguish an invalidated credential from a data-center move."
    spec_occurrences: 526
  - status: 403
    title: "Forbidden"
    remediation: "Also returned as 'This service has not been enabled for your site.', 'XSRF Protection Failure', and 'Eloqua Analyzer license is required' (Reporting API)."
    spec_occurrences: 526
  - status: 404
    title: "Not Found"
    remediation: "The requested resource was not found."
    spec_occurrences: 525
  - status: 409
    title: "Conflict"
    remediation: "Name collision with another asset, or a delete blocked by dependencies."
    spec_occurrences: 188
  - status: 410
    title: "Gone"
    remediation: "The requested resource is no longer available. Present on 179 operations in the published spec."
    spec_occurrences: 179
  - status: 412
    title: "Precondition Failed"
    remediation: "The resource you are attempting to delete has dependencies and cannot be deleted; also used for storage-space conditions."
    spec_occurrences: 179
  - status: 413
    title: "Payload Too Large"
    remediation: "Storage space exceeded."
    spec_occurrences: 179
  - status: 429
    title: "Too Many Requests"
    remediation: "Rate limited. No RateLimit-* or Retry-After header is documented; see rate-limits/eloqua-rate-limits.yml."
  - status: 500
    title: "Internal Server Error"
    remediation: "The service has encountered an error."
    spec_occurrences: 524
  - status: 502
    title: "Bad Gateway"
  - status: 503
    title: "Service Unavailable"
    remediation: "Temporary server error or a timeout processing the request. Oracle's documented remediation is to check Eloqua System Status and retry with increasing delay."
    spec_occurrences: 179
  - status: 301
    title: "Login required"
    remediation: "Documented by Oracle among API status responses."
  - status: 304
    title: "Not Modified"

validation_error_types:
  - type: EndpointParameterError
    meaning: "Caused by incorrect input parameters."
  - type: BooleanRequirement
    meaning: "The value must be either \"true\" or \"false\"."
  - type: ContentRequirement
    meaning: "The content supplied is blacklisted."
  - type: DateRequirement
    meaning: "The value must be a proper date."
  - type: IdRequirement
    meaning: "The value must be an integer greater than 0."
  - type: ImmutabilityRequirement
    meaning: "The value cannot be changed once it has been set."
  - type: IntegerRequirement
    meaning: "The value should be an integer."
  - type: NoDuplicatesRequirement
    meaning: "There is a duplicate value supplied in the request."
  - type: NotNullRequirement
    meaning: "The value cannot be null or missing."
  - type: ObjectValidationError
    meaning: "A problem with one of the properties on the object."
  - type: TextWithNoUrlRequirement
    meaning: "The value must not contain URLs."
  - type: TextWithNoHtmlRequirement
    meaning: "The value must not contain HTML."
  - type: EmailAddressRequirement
    meaning: "The value must contain an email address."
  - type: ValidTextLengthRequirement
    meaning: "The value does not contain a valid number of characters."
  - type: RelationshipRequirement
    meaning: "A relationship between two objects or related properties has not been met."
  - type: SyntaxRequirement
    meaning: "The HTML is not valid or could not be parsed."
  - type: UniquenessRequirement
    meaning: "The supplied name is not unique."
  - type: UrlRequirement
    meaning: "The supplied value should be a valid url."

