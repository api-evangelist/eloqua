      tags:
      - Application/2.0/Programs
      x-internal-id: api-rest-2.0-assets-program-{id}-delete
      x-filename-id: api-rest-2.0-assets-program-id-delete
  /api/rest/2.0/assets/program/active/{id}:
    post:
