      tags:
      - Application/2.0/Programs
      x-internal-id: api-rest-2.0-assets-program-active-{id}-post
      x-filename-id: api-rest-2.0-assets-program-active-id-post
  /api/rest/2.0/assets/program/draft/{id}:
