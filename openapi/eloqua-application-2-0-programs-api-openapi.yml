      x-filename-id: api-rest-2.0-assets-program-post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramRest20'
        description: The request body defines the details of the program to be created.
        required: true
  /api/rest/2.0/assets/program/{id}:
