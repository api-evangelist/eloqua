      x-internal-id: api-rest-1.0-assets-email-footer-post
      x-filename-id: api-rest-1.0-assets-email-footer-post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailFooterRest10'
        description: The request body defines the details of the email footer to be created.
        required: true
  /api/rest/1.0/assets/email/footer/{id}:
    get:
      operationId: ReadIndividualGETRest10
      parameters:
      - name: id
        in: path
        description: Id of the email footer.
        required: true
        schema:
          type: integer
      - name: depth
        in: query
        description: 'Level of detail returned by the request. Eloqua APIs can retrieve entities at three different levels of depth: <code>minimal</code>, <code>partial</code>, and <code>complete</code>. Any other values passed are reset to <code>complete</code> by default. For more information, see <a href=''https://docs.oracle.com/cloud/latest/marketingcs_gs/OMCAB/index.html#CSHID=RequestDepth''>Request depth</a>.'
