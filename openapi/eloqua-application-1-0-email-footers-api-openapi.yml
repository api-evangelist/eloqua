        in: path
        description: Id of the email footer to update.
        required: true
        schema:
          type: integer
      summary: Update an email footer
      description: Updates the email footer specified by the <code>id</code> parameter. All properties should be included in PUT requests, as some properties will be considered blank if not included.
      responses:
        '200':
          description: OK.
          content:
