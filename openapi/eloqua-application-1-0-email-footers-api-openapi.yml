          type: string
      - name: orderBy
        in: query
        description: Specifies the field by which list results are ordered.
        required: false
        schema:
          type: string
      - name: lastUpdatedAt
        in: query
        description: Unix timestamp for the date and time the email footer was last updated.
        required: false
        schema:
          type: integer
      summary: Retrieve a list of email footers
