      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailFooterRest10'
        description: The request body defines the details of the email footer to be updated.
        required: true
    delete:
      operationId: DeleteIndividualDELETERest10
      parameters:
      - name: id
        in: path
        description: Id of the email footer to delete.
        required: true
        schema:
          type: integer
      summary: Delete an email footer
      description: Deletes the email footer specified by the <code>id</code> parameter.
      responses:
        '200':
          description: OK.
        '400':
          description: Bad request. See <a href='https://docs.oracle.com/cloud/latest/marketingcs_gs/OMCAB/index.html#CSHID=HTTPStatusCodes'>Status Codes</a> for information about other possible HTTP status codes.
        '401':
