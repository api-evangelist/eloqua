components:
  schemas:
    QueryResultContactFieldRest10:
      title: QueryResultContactField
      properties:
        type:
          type: string
          description: The asset's type in Eloqua.
        elements:
          type: array
          description: Array of contact fields.
          items:
            $ref: '#/components/schemas/ContactFieldRest10'
        total:
          type: integer
          description: The total amount of results.
        pageSize:
          type: integer
          description: The page size.
        page:
          type: integer
          description: The specified page.
    ContactFieldRest10:
      title: ContactField
      properties:
        type:
          type: string
          description: 'The asset''s type in Eloqua. This is a read-only property. '
        id:
          type: string
          readOnly: true
          description: Id of the contact field. This is a read-only property.
        currentStatus:
          type: string
          description: The email footer's current status.
        name:
          type: string
          description: The name of the contact field.
        description:
          type: string
          description: The description of the contact field.
        permissions:
          type: string
          description: The permissions for the contact field granted to your current instance. This is a read-only property.
        createdBy:
          type: string
          readOnly: true
          description: The login id of the user who created the contact field. This is a read-only property.
        createdAt:
          type: string
          readOnly: true
          description: The date and time the contact field was created, expressed in Unix time. This is a read-only property.
        updatedBy:
          type: string
          readOnly: true
          description: The login id of the user that last updated the contact field.
        updatedAt:
          type: string
          readOnly: true
          description: Unix timestamp for the date and time the contact field was last updated.
        depth:
          type: string
          readOnly: true
          description: 'Level of detail returned by the request. Eloqua APIs can retrieve entities at three different levels of depth: <code>minimal</code>, <code>partial</code>, and <code>complete</code>. Any other values passed are reset to <code>complete</code> by default. For more information, see <a href=''https://docs.oracle.com/cloud/latest/marketingcs_gs/OMCAB/index.html#CSHID=RequestDepth''>Request depth</a>.'
        internalName:
          type: string
          description: The contact field's internal name.
        optionListId:
          type: string
          description: The id of the associated option list.
        checkedValue:
          type: string
          description: The checked value.
        uncheckedValue:
          type: string
          description: The unchecked value of a checkbox custom object field.
        displayType:
          type: string
          description: The contact field's display type.
        dataType:
          type: string
          description: The contact field's data type. This is a read-only property.
        defaultValue:
          type: string
          description: The contact field's default value.
        isReadOnly:
          type: string
          description: Whether or not the contact field is read only.
        isRequired:
          type: string
          description: Whether or not the contact field is required.
        isStandard:
          type: string
          description: Whether or not the contact field is standard.
        outputFormatId:
          type: string
          description: The id of the output format.
        updateType:
          type: string
          description: Denotes under what circumstances the contact field is updated.
        showTrustedVisitorsOnly:
          type: string
          description: Whether or not a contact field is displayed only to trusted visitors.
        isPhoneValidationRequired:
          type: string
          description: ContactField_Field_IsPhoneValidationRequired_Description
