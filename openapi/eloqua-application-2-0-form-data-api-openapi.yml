components:
  schemas:
    FormDataRest20:
      title: FormData
      properties:
        type:
          type: string
          description: The asset's type in Eloqua. This is a read-only property
        id:
          type: string
          readOnly: true
          description: The ID of the form submit if synchronous or ID of the form submission job if asynchronous. This is a read-only property
        currentStatus:
          type: string
          description: 'The current status of the form submission job. Possible values: Queued, InProgress, Error, and Success.'
        submittedAt:
          type: string
          description: Unix timestamp for the date and time the form data was submitted. This is a read-only property
        submittedByContactId:
          type: string
          description: The ID of the contact that submitted the form. This is a read-only property
        fieldValues:
          type: array
          description: A list of key/value pairs identifying the form data (field name / value)
          items:
            $ref: '#/components/schemas/FieldValueRest20'
        processingStepErrors:
          type: array
          description: A list of Processing Step Errors occurred in current form submission. This is a read-only property
          items:
            $ref: '#/components/schemas/ProcessingStepErrorRest20'
        processedAt:
          type: string
          description: Unix timestamp for the date and time the form data was processed if submitted through asynchronous submission. This is a read-only property
        rowId:
          type: integer
          description: In case of an asynchronous form submission if processed then submit ID of form submission. This is a read-only property
        validationErrors:
          type: array
          description: Validation errors if any occured in form submission. This is a read-only property
          items:
            $ref: '#/components/schemas/ObjectValidationErrorRest20'
        correlationId:
          type: string
          description: The unique identifier of form submission within the batch. Optional String field. If present, must be unique across created batches. If <code>correlationId</code> is not unique, then the entire batch will fail. The <code>correlationId</code> is persisted and could be used to identify the form submit.
    ObjectKeyRest20:
      title: ObjectKey
      properties:
        type:
          type: string
        objectType:
          type: string
        objectId:
          type: string
        container:
          $ref: '#/components/schemas/ObjectKeyRest20'
    FieldValueRest20:
      title: FieldValue
      properties:
        type:
          type: string
          description: The asset's type in Eloqua. This is a read-only property.
        value:
          type: string
          description: The value to set the corresponding field id to. Date values must be submitted as a unix timestamp.
        id:
          type: string
          readOnly: true
          description: The id of the field to be set to the corresponding value.
        name:
          type: string
          description: Name of the field value.
    ObjectValidationErrorRest20:
      title: ObjectValidationError
      properties:
        type:
          type: string
        container:
          $ref: '#/components/schemas/ObjectKeyRest20'
        property:
          type: string
        value:
          type: string
        requirement:
          $ref: '#/components/schemas/RequirementRest20'
    ProcessingStepErrorRest20:
      title: ProcessingStepError
      properties:
        type:
          type: string
          description: The asset's type in Eloqua.
        processingStepId:
