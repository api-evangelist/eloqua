      x-internal-id: api-rest-2.0-assets-email-signature-rule-{ruleId}-mappings-put
      x-filename-id: api-rest-2.0-assets-email-signature-rule-ruleid-mappings-put
      requestBody:
        content:
          application/json:
            schema:
              type: array
        description: The request body defines the details of the signature rule mappings to be updated.
        required: true
    delete:
      operationId: DeleteIndividualDELETERest20
      parameters:
      - name: ruleId
        in: path
        description: Id of the signature rule to delete mappings from.
        required: true
        schema:
          type: integer
      summary: Delete signature rule mappings
      description: Delete signature rule mappings for the signature rule specified by the <code>id</code> parameter.
      responses:
        '200':
          description: OK.
        '400':
          description: Bad request. See <a href='https://docs.oracle.com/cloud/latest/marketingcs_gs/OMCAB/index.html#CSHID=HTTPStatusCodes'>Status Codes</a> for information about other possible HTTP status codes.
        '401':
