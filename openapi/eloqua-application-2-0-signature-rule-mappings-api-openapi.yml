      x-internal-id: api-rest-2.0-assets-email-signature-rule-{ruleId}-mappings-delete
      x-filename-id: api-rest-2.0-assets-email-signature-rule-ruleid-mappings-delete
components:
  schemas:
    QueryResultRuleMappingRest20:
      title: QueryResultRuleMapping
      properties:
        type:
          type: string
          description: The asset's type in Eloqua.
        elements:
          type: array
          description: Array of signature rule mappings.
          items:
            $ref: '#/components/schemas/EmailSignatureRuleMappingRest20'
        total:
          type: integer
          description: The total amount of results.
        pageSize:
          type: integer
          description: The page size.
        page:
          type: integer
          description: The specified page.
    EmailSignatureRuleMappingRest20:
      title: EmailSignatureRuleMapping
      properties:
        type:
          type: string
          description: The asset's type in Eloqua.
        matchValue:
          type: string
          description: The value to be used for comparison.
        senderId:
          type: string
          description: The id of the user that will be used as the sender if the contact's field value matches the match value.
