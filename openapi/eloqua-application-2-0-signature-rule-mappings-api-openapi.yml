        '404':
          description: The requested resource was not found. See <a href='https://docs.oracle.com/cloud/latest/marketingcs_gs/OMCAB/index.html#CSHID=HTTPStatusCodes'>Status Codes</a> for information about other possible HTTP status codes.
        '500':
          description: The service has encountered an error. See <a href='https://docs.oracle.com/cloud/latest/marketingcs_gs/OMCAB/index.html#CSHID=HTTPStatusCodes'>Status Codes</a> for information about other possible HTTP status codes.
      tags:
      - Application/2.0/Signature Rule Mappings
      x-internal-id: api-rest-2.0-assets-email-signature-rule-{ruleId}-mappings-post
      x-filename-id: api-rest-2.0-assets-email-signature-rule-ruleid-mappings-post
      requestBody:
        content:
          application/json:
            schema:
              type: array
        description: The request body defines the details of the signature rule mappings to be created.
        required: true
    put:
      operationId: UpdateIndividualPUTRest20
      parameters:
      - name: ruleId
        in: path
        description: Id of the signature rule to update.
        required: true
        schema:
          type: integer
      summary: Update signature rule mappings
      description: 'Update signature rule mappings for the signature rule specified by the <code>id</code> parameter.

        All mappings should be included in PUT requests as any missing mappings will be removed with the update.

        A maximum of 75000 mappings can be provided.'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmailSignatureRuleMappingRest20'
        '400':
          description: Bad request. See <a href='https://docs.oracle.com/cloud/latest/marketingcs_gs/OMCAB/index.html#CSHID=HTTPStatusCodes'>Status Codes</a> for information about other possible HTTP status codes.
