    SyncActionType:
      title: SyncActionType
      description: The action to take at time of synchronization.
      default: add
      enum:
      - add
      - remove
      - setStatus
      type: string
    ImportRuleType:
      title: ImportRuleType
      description: Import.ImportRuleType_Description
      default: createAndUpdate
      enum:
      - createAndUpdate
      - updateOnly
      - createOnly
      type: string
    SyncStatusType:
