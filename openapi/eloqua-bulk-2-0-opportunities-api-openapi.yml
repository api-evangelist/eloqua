      title: MemberStatus
      description: The status of members.
      default: bounced
      enum:
      - bounced
      - subscribed
      - unsubscribed
      - active
      - complete
      - pending
      - errored
      - 'yes'
      - 'no'
      - invalid
      - permission
      type: string
    RuleType:
      title: RuleType
