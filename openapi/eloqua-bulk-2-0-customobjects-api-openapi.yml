components:
  schemas:
    CustomObject:
      title: CustomObject
      description: 'The definition of a custom object. Custom Objects are used to store data that may be related to a Contact or Company''s record. Some examples of data you might store in a custom object include: Product Purchase history, Registrations, Warranty Expiry. Custom objects can be synchronized with your CRM system on a scheduled basis.'
      properties:
        createdAt:
          format: date-time
          title: createdAt
          description: The date and time the entity was created, expressed using the ISO-8601 standard. This is a read-only property.
          type: string
        createdBy:
          title: createdBy
          description: The login id of the user who created the entity. This is a read-only property.
          type: string
        displayNameFieldUri:
          title: displayNameFieldUri
          description: The relative uri used to reference the custom object field that represents the display field, for this custom object.
          type: string
        emailAddressFieldUri:
          title: emailAddressFieldUri
          description: The relative uri used to reference the custom object field that represents an email address, for this custom object.
          type: string
        name:
          title: name
          description: The name of the custom object definition.
          type: string
        uniqueFieldUri:
          title: uniqueFieldUri
          description: The relative uri used to reference the custom object field that has a uniqueness constraint on it, for this custom object.
          type: string
        updatedAt:
          format: date-time
          title: updatedAt
          description: The date and time the entity was last updated, expressed using the ISO-8601 standard. This is a read-only property.
          type: string
        updatedBy:
          title: updatedBy
          description: The login id of the user that last updated the entity. This is a read-only property.
          type: string
        uri:
          title: uri
          description: System-generated unique resource identifier that defines the definition for future referencing. This is a read-only property.
          type: string
    SyncAction:
      title: SyncAction
      description: The definition of the action to take at time of syncronization.
      properties:
        action:
          $ref: '#/components/schemas/SyncActionType'
        destination:
          title: destination
          description: The ML statement used to reference an object used by the action.
          type: string
        status:
          $ref: '#/components/schemas/MemberStatus'
        updateAll:
          title: updateAll
          description: Update status of all records in an execution.
          type: boolean
    CustomObjectField:
      title: CustomObjectField
      description: The definition of a field on the referenced custom object.
      properties:
        createdAt:
          format: date-time
          title: createdAt
          description: The date and time the entity was created, expressed using the ISO-8601 standard. This is a read-only property.
          type: string
        createdBy:
          title: createdBy
          description: The login id of the user who created the entity. This is a read-only property.
          type: string
        dataType:
          $ref: '#/components/schemas/DataType'
        defaultValue:
          title: defaultValue
          description: The field's default value.
          type: string
        hasNotNullConstraint:
          title: hasNotNullConstraint
          description: Indicates whether the field can have null values (i.e. empty).
          type: boolean
        hasReadOnlyConstraint:
          title: hasReadOnlyConstraint
          description: Indicates whether the field can be written to.
          type: boolean
        hasUniquenessConstraint:
          title: hasUniquenessConstraint
          description: Indicates whether the field must have a unique value.
          type: boolean
        internalName:
          title: internalName
          description: The field's internal name (used to uniquely identify it).
          type: string
        name:
          title: name
          description: The name of the custom object definition.
          type: string
        statement:
          title: statement
          description: The markup language statement used to reference the field in an import or export mapping.
          type: string
        updatedAt:
          format: date-time
          title: updatedAt
          description: The date and time the entity was last updated, expressed using the ISO-8601 standard. This is a read-only property.
          type: string
        updatedBy:
          title: updatedBy
          description: The login id of the user that last updated the entity. This is a read-only property.
          type: string
        uri:
          title: uri
          description: System-generated unique resource identifier that defines the definition for future referencing. This is a read-only property.
          type: string
    Import:
      title: Import
      description: The request body defines the details of the import definition. The following table displays properties for creating import definitions.
      properties:
        autoDeleteDuration:
          title: autoDeleteDuration
          description: Time until the definition will be deleted, expressed using the ISO-8601 standard.
          type: string
        createdAt:
          format: date-time
          title: createdAt
          description: The date and time the entity was created, expressed using the ISO-8601 standard. This is a read-only property.
          type: string
        createdBy:
          title: createdBy
          description: The login id of the user who created the entity. This is a read-only property.
          type: string
        dataRetentionDuration:
          title: dataRetentionDuration
          description: The length of time that unsync'd data from this import should remain in the staging area. Bulk API 2.0 uses the ISO-8601 standard for specifying all durations. Valid values are anything from PT1H (1 hour) to P14D (2 weeks). This setting will default to P7D (7 days) if not explicitly set during import definition creation.
          type: string
        externalSystemId:
          title: externalSystemId
          description: The id of the external system.
          type: integer
        fields:
          title: fields
          description: List of fields to be included in the operation.
          type: object
        identifierFieldName:
          title: identifierFieldName
          description: 'The field which will be used to identify the entity. Must be a string value, at least 1 character and at most 100 characters long. The following field types are not supported: Large Text, Date, and Boolean.'
          type: string
        importPriorityUri:
          title: importPriorityUri
          description: Must reference an existing <code>/imports/priorities/{id}</code>. For more information about this parameter, see the <a href='https://docs.oracle.com/cloud/latest/marketingcs_gs/OMCAB/index.html#CSHID=ImportExportParams'>Oracle Eloqua Developer Help Center</a>.
          type: string
        importRule:
          $ref: '#/components/schemas/ImportRuleType'
        isSyncTriggeredOnImport:
          title: isSyncTriggeredOnImport
          description: Whether or not the sync is triggered on import.
          type: boolean
        isUpdatingMultipleMatchedRecords:
          title: isUpdatingMultipleMatchedRecords
          description: Whether or not imported data will be mapped to multiple existing records. For contact imports, the <code>isUpdatingMultipleMatchedRecords</code> property must be set to <code>false</code> to update <code>Contact.Field(C_EmailAddress)</code>.
          type: boolean
        kbUsed:
          format: int64
          title: kbUsed
          description: The amount of space used in kilobytes. This is a read-only property.
          type: integer
        name:
          title: name
          description: The name of the import definition.
          type: string
        nullIdentifierFieldName:
          title: nullIdentifierFieldName
          description: Whether or not to null the identifier field.
          type: boolean
        syncActions:
          title: syncActions
          description: 'Specifies operations to perform during the sync with a maximum of 10 actions. See <a href=''http://docs.oracle.com/cloud/latest/marketingcs_gs/OMCAB/index.html#CSHID=SyncActions''>Sync actions parameters</a> for a list of sync actions. For more information about this parameter, see the <a href=''https://docs.oracle.com/cloud/latest/marketingcs_gs/OMCAB/index.html#CSHID=ImportExportParams''>Oracle Eloqua Developer Help Center</a>.


            There currently are not any sync actions available for Events.'
          type: array
          items:
            $ref: '#/components/schemas/SyncAction'
        updatedAt:
          format: date-time
          title: updatedAt
          description: The date and time the entity was last updated, expressed using the ISO-8601 standard. This is a read-only property.
          type: string
        updatedBy:
          title: updatedBy
          description: The login id of the user that last updated the entity. This is a read-only property.
          type: string
        updateRule:
          $ref: '#/components/schemas/RuleType'
        updateRuleByField:
          title: updateRuleByField
          description: The rule by field used when doing updates on existing data. Each pair is a field name mapped to a rule type.
          type: object
        uri:
          title: uri
          description: System-generated unique resource identifier that defines the definition for future referencing. This is a read-only property.
          type: string
