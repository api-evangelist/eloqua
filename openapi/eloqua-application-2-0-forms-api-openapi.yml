components:
  schemas:
    ProcessingStepConditionRest20:
      title: ProcessingStepCondition
      properties:
        type:
          type: string
          description: The asset's type in Eloqua. This is a read-only property.
        isConditionallyNegated:
          type: string
          description: The conditions for which the processing step will execute. If yes, the processing step will execute when the conditions are met. If no, the processing step will execute when the conditions are not met.
        conditionalFieldCriteria:
          type: array
          description: The conditional field criteria for the form processing step condition.
          items:
            $ref: '#/components/schemas/FieldComparisonCriteriaRest20'
    ArchiveParameterRest20:
      title: ArchiveParameter
      properties:
        type:
          type: string
          description: The asset's type in Eloqua. This is a read-only property.
        targetFolderId:
          type: string
          description: The target folder to which the asset should be moved upon archive/unarchive. If not passed, the root folder will be used.
    FormElementRest20:
      title: FormElement
      properties:
        type:
          type: string
          description: The asset's type in Eloqua. This is a read-only property.
        id:
          type: string
          readOnly: true
          description: The ID of the form element. This is a read-only property.
        currentStatus:
          type: string
          description: The form element's current status.
        name:
          type: string
          description: Name of the form element.
        description:
          type: string
          description: The description of the form element.
        permissions:
          type: array
          description: The permissions for the form element granted to your current instance.
          items:
            type: string
        folderId:
          type: string
          readOnly: true
          description: The ID of the associated folder.
        sourceTemplateId:
          type: string
          description: The ID of the form element.
        createdBy:
          type: string
          readOnly: true
          description: The login ID of the user who created the form element.
        createdByName:
          type: string
          description: The name of the user who created the form element.
        createdAt:
          type: string
          readOnly: true
          description: The date and time the form element was created, expressed in Unix time.
        updatedBy:
          type: string
          readOnly: true
          description: The login ID of the user that last updated the form element.
        updatedByName:
          type: string
          description: The name of the user who last updated the form element.
        updatedAt:
          type: string
          readOnly: true
          description: Unix timestamp for the date and time the form element was last updated.
        scheduledFor:
          type: string
          readOnly: true
          description: The date the form element is scheduled.
        depth:
          type: string
          readOnly: true
          description: 'Level of detail returned by the request. Eloqua APIs can retrieve entities at three different levels of depth: <code>minimal</code>, <code>partial</code>, and <code>complete</code>. Any other values passed are reset to <code>complete</code> by default. For more information, see <a href=''https://docs.oracle.com/cloud/latest/marketingcs_gs/OMCAB/index.html#CSHID=RequestDepth'' target=''_blank''>Request depth</a>.'
        instructions:
          type: string
          description: The form element's field instructions. Field instructions are optional instructions that help users fill in fields.
        style:
          type: string
          description: The asset's main layout style.
    QueryResultFormRest20:
      title: QueryResultForm
      properties:
        type:
          type: string
          description: The asset's type in Eloqua.
        elements:
          type: array
          description: Array of form elements.
          items:
            $ref: '#/components/schemas/FormRest20'
        total:
          type: integer
          description: The total amount of results.
        pageSize:
          type: integer
          description: The page size.
        page:
          type: integer
          description: The specified page.
    FormFieldUpdateMappingRest20:
      title: FormFieldUpdateMapping
      properties:
        type:
          type: string
          description: The asset's type in Eloqua. This is a read-only property.
        id:
          type: string
          readOnly: true
          description: Id of the form field update mapping.
        currentStatus:
          type: string
          description: The form field update mapping's current status.
        name:
          type: string
          description: The name of the form field update mapping.
        description:
          type: string
          description: The description of the field comparison criteria.
        permissions:
          type: array
          description: The permissions for the form field update mapping granted to your current instance. This is a read-only property.
          items:
            type: string
        folderId:
          type: string
          readOnly: true
          description: Id of the folder. This is a read-only property.
        sourceTemplateId:
          type: string
          description: Id of the source template. This is a read-only property.
        createdBy:
          type: string
          readOnly: true
          description: The login id of the user who created the form field update mapping.
        createdByName:
          type: string
          description: The name of the user who created the form field update mapping.
        createdAt:
          type: string
          readOnly: true
          description: The date and time the form field update mapping was created, expressed in Unix time.
        updatedBy:
          type: string
          readOnly: true
          description: The login id of the user that last updated the form field update mapping.
        updatedByName:
          type: string
          description: The name of the user who last updated the form field update mapping.
        updatedAt:
          type: string
          readOnly: true
          description: Unix timestamp for the date and time the form field update mapping was last updated.
        scheduledFor:
          type: string
          readOnly: true
          description: The date and time the form field update mapping is scheduled.
        depth:
          type: string
          readOnly: true
          description: 'Level of detail returned by the request. Eloqua APIs can retrieve entities at three different levels of depth: <code>minimal</code>, <code>partial</code>, and <code>complete</code>. Any other values passed are reset to <code>complete</code> by default. For more information, see <a href=''https://docs.oracle.com/cloud/latest/marketingcs_gs/OMCAB/index.html#CSHID=RequestDepth''>Request depth</a>.'
        sourceFormFieldId:
          type: string
          description: 'Id of the source form field. '
        updateType:
          type: string
          description: The update type of the form field update mapping.
        targetEntityFieldId:
          type: string
          description: Id of the target field.
    FormRest20:
      title: Form
      properties:
        type:
          type: string
          description: The asset's type in Eloqua. This is a read-only property.
        id:
          type: string
          readOnly: true
          description: Id of the form.
        currentStatus:
          type: string
          description: 'The form''s current status. Example: draft, active, or complete.'
        name:
          type: string
          description: The name of the form.
        description:
          type: string
          description: The description of the form.
        permissions:
          type: array
          description: The permissions for the form granted to your current instance. This is a read-only property.
          items:
            type: string
        folderId:
          type: string
          readOnly: true
          description: The ID of the containing folder.
        sourceTemplateId:
          type: string
          description: Id of the source template.
        createdBy:
          type: string
          readOnly: true
          description: The login ID of the user who created the form.
        createdByName:
          type: string
          description: The name of the user who created the form.
        createdAt:
          type: string
          readOnly: true
          description: The date and time the form was created, expressed in Unix time.
        updatedBy:
          type: string
          readOnly: true
          description: The login ID of the user that last updated the form.
        updatedByName:
          type: string
          description: The name of the user who last updated the form.
        updatedAt:
          type: string
          readOnly: true
