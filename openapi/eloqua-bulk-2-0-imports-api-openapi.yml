      deprecated: false
      x-internal-id: api-bulk-2.0-imports-data-get
      x-filename-id: api-bulk-2.0-imports-data-get
  /api/bulk/2.0/imports/priorities/{id}:
    get:
      tags:
      - Bulk/2.0/imports
      summary: Retrieve an import priority
      description: Retrieves an import priority.
      operationId: GetImportPriorityIndividual
      parameters:
      - name: id
        in: path
        description: The unique resource identifier.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                title: ImportPriorityIndividualResponse
                description: The response body contains information about the import priority definition.
                properties:
                  createdAt:
                    format: date-time
                    title: createdAt
                    description: The date and time the entity was created, expressed using the ISO-8601 standard. This is a read-only property.
                    type: string
                  createdBy:
                    title: createdBy
                    description: The login id of the user who created the entity. This is a read-only property.
                    type: string
                  name:
                    title: name
                    description: The asset's name.
                    type: string
                  priority:
                    title: priority
                    description: The import's queue position. This is a read-only property.
                    type: integer
                  updatedAt:
                    format: date-time
                    title: updatedAt
                    description: The date and time the entity was last updated, expressed using the ISO-8601 standard. This is a read-only property.
                    type: string
                  updatedBy:
                    title: updatedBy
                    description: The login id of the user that last updated the entity. This is a read-only property.
                    type: string
                  uri:
                    title: uri
                    description: System-generated unique resource identifier that defines the definition for future referencing. This is a read-only property.
                    type: string
        '400':
