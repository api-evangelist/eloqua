openapi: 3.1.0
info:
  title: Oracle Eloqua Bulk Account Exports Account Imports API
  description: The Bulk API for Oracle Eloqua Marketing Cloud Service, designed for high-volume data operations including imports, exports, and synchronization of large datasets for contacts, accounts, activities, and custom objects.
  version: '2.0'
  contact:
    name: Oracle Support
    url: https://support.oracle.com/
  termsOfService: https://www.oracle.com/legal/terms.html
servers:
- url: https://secure.p01.eloqua.com/API/Bulk/2.0
  description: Eloqua Bulk API v2.0 (pod may vary per instance)
security:
- basicAuth: []
- oAuth2: []
tags:
- name: Account Imports
  description: Import account data in bulk
paths:
  /accounts/imports:
    get:
      operationId: listAccountImports
      summary: Oracle Eloqua List account import definitions
      description: Retrieve all account import definitions.
      tags:
      - Account Imports
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Successfully retrieved account imports
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportList'
        '401':
          description: Unauthorized
    post:
      operationId: createAccountImport
      summary: Oracle Eloqua Create an account import definition
      description: Create a new import definition for accounts.
      tags:
      - Account Imports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportDefinition'
      responses:
        '201':
          description: Account import definition created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportDefinition'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
  /accounts/imports/{id}:
    get:
      operationId: getAccountImport
      summary: Oracle Eloqua Retrieve an account import definition
      description: Retrieve a specific account import definition.
      tags:
      - Account Imports
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Successfully retrieved account import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportDefinition'
        '401':
          description: Unauthorized
        '404':
          description: Import definition not found
    delete:
      operationId: deleteAccountImport
      summary: Oracle Eloqua Delete an account import definition
      description: Delete an account import definition.
      tags:
      - Account Imports
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Import definition deleted
        '401':
          description: Unauthorized
        '404':
          description: Import definition not found
  /accounts/imports/{id}/data:
    post:
      operationId: pushAccountImportData
      summary: Oracle Eloqua Push data to an account import
      description: Push data records to be processed by the account import definition.
      tags:
      - Account Imports
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                additionalProperties:
                  type: string
      responses:
        '204':
          description: Data pushed successfully
        '400':
          description: Bad request
        '401':
          description: Unauthorized
components:
  schemas:
    ImportDefinition:
      type: object
      required:
      - name
      - fields
      - identifierFieldName
      properties:
        uri:
          type: string
          description: URI of the import definition
          readOnly: true
        name:
          type: string
          description: Name of the import definition
        fields:
          type: object
          description: 'Map of source column names to Eloqua field statement identifiers (e.g., {"EmailAddress": "{{Contact.Field(C_EmailAddress)}}"})'
          additionalProperties:
            type: string
        identifierFieldName:
          type: string
          description: The field used to match import data to existing records (e.g., "EmailAddress")
        isSyncTriggeredOnImport:
          type: boolean
          description: Whether a sync is automatically triggered when data is pushed
          default: false
        syncActions:
          type: array
          description: Actions to perform during sync
          items:
            $ref: '#/components/schemas/SyncAction'
        dataRetentionDuration:
          type: string
          description: How long imported data is retained
        isUpdatingMultipleMatchedRecords:
          type: boolean
          description: Whether to update all matching records or just the first
          default: false
        autoDeleteDuration:
          type: string
          description: Auto-delete duration for the import definition
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          readOnly: true
        syncedInstanceUri:
          type: string
          description: URI of the last sync associated with this definition
          readOnly: true
        status:
          type: string
          description: Status of the import definition
          readOnly: true
    ImportList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImportDefinition'
        totalResults:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean
    SyncAction:
      type: object
      properties:
        action:
          type: string
          enum:
          - add
          - remove
          - setStatus
          description: The action to perform
        destination:
          type: string
          description: The destination for the action (e.g., a contact list URI or subscription status)
        status:
          type: string
          description: The status to set (when action is setStatus)
  parameters:
    offset:
      name: offset
      in: query
      description: Starting index for pagination
      schema:
        type: integer
        minimum: 0
        default: 0
    limit:
      name: limit
      in: query
      description: Maximum number of records to return
      schema:
        type: integer
        minimum: 1
        maximum: 50000
        default: 1000
    id:
      name: id
      in: path
      required: true
      description: The unique identifier of the resource
      schema:
        type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication using company\username and password in the format CompanyName\Username.
    oAuth2:
      type: oauth2
      description: OAuth 2.0 authorization code flow
      flows:
        authorizationCode:
          authorizationUrl: https://login.eloqua.com/auth/oauth2/authorize
          tokenUrl: https://login.eloqua.com/auth/oauth2/token
          scopes:
            full: Full access to all Eloqua resources
externalDocs:
  description: Oracle Eloqua Bulk API Documentation
  url: https://docs.oracle.com/en/cloud/saas/marketing/eloqua-rest-api/BulkAPI.html
