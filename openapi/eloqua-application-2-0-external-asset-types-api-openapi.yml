      x-internal-id: api-rest-2.0-assets-external-type-{id}-put
      x-filename-id: api-rest-2.0-assets-external-type-id-put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalAssetTypeRest20'
        description: The request body defines the details of the external asset type to be updated.
        required: true
    delete:
      operationId: DeleteIndividualDELETERest20
      parameters:
      - name: id
        in: path
        description: Id of the external asset type.
        required: true
        schema:
          type: integer
      summary: Delete an external asset type
      description: Deletes the external asset type specified by the <code>id</code> parameter.
      responses:
        '200':
          description: OK.
        '400':
          description: Bad request. See <a href='https://docs.oracle.com/cloud/latest/marketingcs_gs/OMCAB/index.html#CSHID=HTTPStatusCodes'>Status Codes</a> for information about other possible HTTP status codes.
        '401':
