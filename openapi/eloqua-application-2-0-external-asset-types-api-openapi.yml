      tags:
      - Application/2.0/External asset types
      x-internal-id: api-rest-2.0-assets-external-type-{id}-get
      x-filename-id: api-rest-2.0-assets-external-type-id-get
    put:
      operationId: UpdateIndividualPUTRest20
      parameters:
      - name: id
        in: path
        description: Id of the external asset type to update.
        required: true
        schema:
          type: integer
      summary: Update an external asset type
      description: Updates the external asset type specified by the <code>id</code> parameter.
      responses:
        '200':
          description: OK.
          content:
