          type: string
          readOnly: true
          description: Id of the external activity type.
        currentStatus:
          type: string
          description: The external activity type's current status.
        description:
          type: string
          description: The description of the external activity type.
        permissions:
          type: array
          description: The permissions for the external activity type granted to your current instance. This is a read-only property.
          items:
            type: string
        folderId:
          type: string
          readOnly: true
          description: The folder id of the folder which contains the external activity type.
        sourceTemplateId:
          type: string
          description: Id of the template used to create the external activity type.
        createdBy:
          type: string
          readOnly: true
          description: The login id of the user who created the external activity type.
        createdByName:
          type: string
          description: The name of the user who created the external activity type.
        createdAt:
          type: string
          readOnly: true
          description: The date and time the external activity type was created, expressed in Unix time.
        updatedBy:
          type: string
          readOnly: true
          description: The login id of the user that last updated the external activity type.
        updatedByName:
          type: string
          description: The name of the user who last updated the external activity type.
        updatedAt:
          type: string
          readOnly: true
          description: Unix timestamp for the date and time the external activity type was last updated.
        scheduledFor:
          type: string
          readOnly: true
