                    type: string
                  kbUsed:
                    format: int64
                    title: kbUsed
                    description: The amount of space used in kilobytes. This is a read-only property.
                    type: integer
                  maxRecords:
                    title: maxRecords
                    description: The maximum amount of records.
                    type: integer
                  name:
