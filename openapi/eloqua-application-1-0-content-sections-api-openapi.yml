        currentStatus:
          type: string
          description: 'The form''s current status. Example: draft, active, or complete.'
        name:
          type: string
          description: The name of the form.
        description:
          type: string
          description: The description of the form.
        permissions:
          type: string
          description: The permissions for the form granted to your current instance. This is a read-only property.
        createdBy:
          type: string
          readOnly: true
          description: The login id of the user who created the form.
        createdAt:
          type: string
