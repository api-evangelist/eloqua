openapi: 3.2.0
info:
  title: REST API for Oracle Eloqua Marketing Cloud Service Application/1.0/Landing pages API
  description: The Oracle Eloqua Marketing Cloud Service REST APIs enable you to extend the functionality of the product, build Apps, and perform high volume data transfers.
  version: 2026.08.07
  x-summary: The Oracle Eloqua Marketing Cloud Service REST APIs enable you to extend the functionality of the product, build Apps, and perform high volume data transfers.
tags:
- name: Application/1.0/Landing pages
  description: "Landing pages are often the first significant part of a campaign that a contact will see. A contact may be directed to your landing page from a link in an email or from an ad on the web. The landing page provides the contact with more information and options related to the email or ad that brought them there. On the landing page they can be asked to participate in the campaign by reviewing detailed information, submitting a form, or clicking a button to receive additional information etc. The landing page moves prospects through your campaign and gives them a clearer idea about your product and your companies trustworthiness. \n\n<a href='https://docs.oracle.com/cloud/latest/marketingcs_gs/OMCAA/index.html#CSHID=LandingPages'>Learn more about landing pages</a>."
paths:
  /api/rest/1.0/assets/landingPage:
    post:
      operationId: CreateIndividualPOSTRest10
      summary: Create a landing page
      description: Creates a landing page that matches the criteria specified by the request body for <code>htmlContent</code> with a type of <code>RawHtmlContent</code>.
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LandingPageRest10'
        '400':
          description: Bad request. See <a href='https://docs.oracle.com/cloud/latest/marketingcs_gs/OMCAB/index.html#CSHID=HTTPStatusCodes'>Status Codes</a> for information about other possible HTTP status codes.
        '401':
          description: Unauthorized. See <a href='https://docs.oracle.com/cloud/latest/marketingcs_gs/OMCAB/index.html#CSHID=HTTPStatusCodes'>Status Codes</a> for information about other possible HTTP status codes.
        '403':
