components:
  schemas:
    FieldMergeRest10:
      title: FieldMerge
      properties:
        type:
          type: string
          description: The asset's type in Eloqua. This is a read-only property.
        id:
          type: string
          readOnly: true
          description: Id of the field merge. This is a read-only property.
        currentStatus:
          type: string
          description: The field merge's current status.
        name:
          type: string
          description: Name of the field merge.
        description:
          type: string
          description: The description of the field merge.
        permissions:
          type: string
          description: The permissions for the field merge granted to your current instance.
        createdBy:
          type: string
          readOnly: true
          description: The login id of the user who created the field merge.
        createdAt:
          type: string
          readOnly: true
          description: The date and time the field merge was created, expressed in Unix time.
        updatedBy:
          type: string
          readOnly: true
          description: The login id of the user that last updated the field merge.
        updatedAt:
          type: string
          readOnly: true
          description: Unix timestamp for the date and time the field merge was last updated.
        depth:
          type: string
          readOnly: true
          description: 'Level of detail returned by the request. Eloqua APIs can retrieve entities at three different levels of depth: <code>minimal</code>, <code>partial</code>, and <code>complete</code>. Any other values passed are reset to <code>complete</code> by default. For more information, see <a href=''https://docs.oracle.com/cloud/latest/marketingcs_gs/OMCAB/index.html#CSHID=RequestDepth''>Request depth</a>.'
        syntax:
          type: string
          description: The syntax of the field merge.
        defaultValue:
          type: string
          description: The default value of the field merge.
        contactFieldId:
          type: string
          description: Id of the associated contact field.
        accountFieldId:
          type: string
          description: Id of the associated account field.
        eventId:
          type: string
          description: Id of the associated event.
        eventFieldId:
          type: string
          description: Id of the associated event field.
        eventSessionFieldId:
          type: string
          description: Id of the associated event session field.
        mergeType:
          type: string
          description: 'Type of the field merge. Possible values include: <code>contactField</code>, <code>accountField</code>, <code>eventField</code>, <code>eventSessionField</code>, and <code>customObjectField</code>.'
    EmailHeaderRest10:
      title: EmailHeader
      properties:
        type:
          type: string
          description: 'The asset''s type in Eloqua. This is a read-only property. '
        id:
          type: string
          readOnly: true
          description: Id of the email header. This is a read-only property.
        currentStatus:
          type: string
          description: The asset's current status. This is a read-only property.
        name:
          type: string
          description: The name of the email header.
        description:
          type: string
          description: The description of the email header.
        permissions:
          type: string
          description: The permissions for the email header granted to your current instance. This is a read-only property.
        createdBy:
          type: string
          readOnly: true
          description: The login id of the user who created the email header.
        createdAt:
          type: string
          readOnly: true
          description: The date and time the email header was created, expressed in Unix time.
        updatedBy:
          type: string
          readOnly: true
          description: The login id of the user that last updated the email header.
        updatedAt:
          type: string
          readOnly: true
          description: Unix timestamp for the date and time the email header was last updated.
        depth:
          type: string
          readOnly: true
          description: 'Level of detail returned by the request. Eloqua APIs can retrieve entities at three different levels of depth: <code>minimal</code>, <code>partial</code>, and <code>complete</code>. Any other values passed are reset to <code>complete</code> by default. For more information, see <a href=''https://docs.oracle.com/cloud/latest/marketingcs_gs/OMCAB/index.html#CSHID=RequestDepth''>Request depth</a>.'
        body:
          type: string
          description: The email header's html text content.
        text:
          type: string
          description: The raw text from the "body" parameter.
        fieldMerges:
          type: array
          description: A list of associated Field Merges.
          items:
            $ref: '#/components/schemas/FieldMergeRest10'
        hyperlinks:
          type: array
          description: A list of hyperlinks contained within the asset.
          items:
            $ref: '#/components/schemas/HyperlinkRest10'
    QueryResultHeaderRest10:
      title: QueryResultHeader
      properties:
        type:
          type: string
          description: The asset's type in Eloqua.
        elements:
          type: array
          description: Array of header fields.
          items:
            $ref: '#/components/schemas/EmailHeaderRest10'
        total:
          type: integer
          description: The total amount of results.
        pageSize:
          type: integer
          description: The page size.
        page:
          type: integer
          description: The specified page.
    HyperlinkRest10:
      title: Hyperlink
      properties:
        type:
          type: string
          description: The asset's type in Eloqua. This is a read-only property.
        id:
          type: string
          readOnly: true
          description: Id of the hyperlink. This is a read-only property.
        currentStatus:
          type: string
          description: The hyperlink's current status.
        name:
          type: string
          description: Name of the hyperlink.
        description:
          type: string
          description: The description of the hyperlink.
        permissions:
