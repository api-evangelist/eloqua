          type: string
      - name: orderBy
        in: query
        description: Specifies the field by which list results are ordered.
        required: false
        schema:
          type: string
      - name: lastUpdatedAt
        in: query
        description: When the email header was last updated.
        required: false
        schema:
          type: integer
      summary: Retrieve a list of email headers
      description: Retrieves all email headers that match the criteria specified by the request parameters.
      responses:
